<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa2</title>
    <script>
        // Exemplo: inverter um array usando for começando do final
        const arr = ["a", "b", "c", "d"];
        const invertido = [];

        for (let i = arr.length - 1; i >= 0; i--) {
            invertido.push(arr[i]);
        }

        // Exibir apenas no console
        console.log(arr);
        console.log(invertido);
    </script>
