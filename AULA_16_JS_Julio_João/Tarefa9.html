<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa2</title>
    <script>
        // Conta quantas vezes a letra 'a' aparece em "abracadabra"
        const num = [3, 5, 1];

        const num2 = [4, 2, 6];

        // Concatenar corretamente os arrays
        const numeros = num.concat(num2);

        // Ordenação numérica (por padrão sort() ordena como strings)
        numeros.sort((a, b) => a - b);

        console.log(numeros);

    </script>
</head>
