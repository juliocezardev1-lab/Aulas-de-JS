<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa2</title>
    <script>
        // Conta quantas vezes a letra 'a' aparece em "abracadabra"
        const palavra = "abracadabra";
        let contador = 0;

        for (let char of palavra) {
            if (char === 'a') contador++;
        }

        console.log(`A letra 'a' aparece ${contador} vezes em "${palavra}".`);
    </script>
