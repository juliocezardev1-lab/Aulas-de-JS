    <script>

        class Calculadora{
            somar(a,b){
                return a + b;
            }
            subtrair(a,b){
                return a - b;
            }
            multiplicacao(a,b){
                return a * b;
            }
            divisao(a,b){
                return a / b;
            }
        }
        const calc = new Calculadora();
        console.log(calc.somar(7,15));// com o código comentado acima é possivel substituir o numero pelo "a"
        console.log(calc.subtrair(7,15));
    </script>
