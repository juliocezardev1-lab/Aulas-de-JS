<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metodo forEach em Arrays</title>
    <script>
        const frutas = ['maçã','banana','laranja'];

        frutas.forEach((fruta,index)=> {
            console.log(`${index+1}. ${fruta}`);
        }); //A fruta guarda a fruta e o index guarda a sua posição
    </script>
</head>
<body>
    
</body>
</html>
